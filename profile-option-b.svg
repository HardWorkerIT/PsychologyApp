<svg xmlns="http://www.w3.org/2000/svg" width="900" height="2000" viewBox="0 0 450 1000" role="img" aria-labelledby="title desc">
  <title id="title">Профиль — вариант B: опоры под рукой</title>
  <desc id="desc">Профиль начинается с проверки состояния, показывает краткую статистику и объединяет историю с избранным.</desc>
