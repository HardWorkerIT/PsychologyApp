  <text class="text" x="225" y="411" text-anchor="middle" font-size="24" font-weight="700">0</text>
  <text class="text muted" x="225" y="438" text-anchor="middle" font-size="13">тестов</text>
  <text class="text" x="361" y="411" text-anchor="middle" font-size="24" font-weight="700">0/7</text>
  <text class="text muted" x="361" y="438" text-anchor="middle" font-size="13">дней на неделе</text>

