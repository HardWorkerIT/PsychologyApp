  <text class="text muted" x="119" y="266" font-size="13">Короткая проверка состояния</text>
  <path d="M405 243l6 7-6 7" fill="none" stroke="#7b8b9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

