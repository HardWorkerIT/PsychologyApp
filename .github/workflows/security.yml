name: Security

on:
  push:
    branches: [main, master, stage, features/re-design, "features/**", "bugfixes/**"]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vulnerable-packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet workload install maui-android
      - name: Fail on known-vulnerable NuGet packages
        run: |
          dotnet restore PsychologyApp.Domain/PsychologyApp.Domain.csproj
          dotnet restore PsychologyApp.Application/PsychologyApp.Application.csproj
          dotnet restore PsychologyApp.Infrastructure/PsychologyApp.Infrastructure.csproj
          dotnet restore PsychologyApp.Bootstrap/PsychologyApp.Bootstrap.csproj
          dotnet restore PsychologyApp.Presentation/PsychologyApp.Presentation.csproj
          for proj in PsychologyApp.Domain PsychologyApp.Application PsychologyApp.Infrastructure PsychologyApp.Bootstrap PsychologyApp.Presentation; do
            dotnet list "$proj/$proj.csproj" package --vulnerable --include-transitive | tee "vuln-$proj.txt"
          done
          if grep -h -q "has the following vulnerable packages" vuln-*.txt; then
            echo "Vulnerable packages found"; exit 1
          fi
