name: CI

on:
  workflow_call:
  push:
    branches: [master, stage, features/re-design, "features/**", "bugfixes/**", "release/**", "codex/**"]
  pull_request:
    branches: [main, master, stage, features/re-design, "release/**"]

jobs:
  build-test:
    runs-on: windows-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - run: dotnet workload install maui-android
      - name: Check for blocking async calls in production code
        shell: pwsh
        run: ./scripts/check-no-blocking-async.ps1
      - run: dotnet restore PsychologyApp.sln
      - run: dotnet build PsychologyApp.sln -c Debug
      - run: dotnet test PsychologyApp.sln -c Debug --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults --logger trx
      # A failed test becomes an annotation on the run page: the annotations can be read without signing in, the job log cannot.
      # Some tests fail only now and then on the runner; this names them the first time.
      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Recurse -Filter *.trx | ForEach-Object {
            [xml]$trx = Get-Content $_.FullName -Raw
            $ns = @{ t = "http://microsoft.com/schemas/VisualStudio/TeamTest/2010" }
            Select-Xml -Xml $trx -Namespace $ns -XPath "//t:UnitTestResult[@outcome='Failed']" | ForEach-Object {
              $r = $_.Node
              $message = ($r.Output.ErrorInfo.Message -replace "`r?`n", " ")
              if ($message.Length -gt 600) { $message = $message.Substring(0, 600) }
              Write-Output "::error title=Failed test::$($r.testName) - $message"
            }
          }
      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool
      - name: Coverage summary
        run: reportgenerator "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:CoverageReport" "-reporttypes:TextSummary;JsonSummary" "-assemblyfilters:+PsychologyApp.*;-*Tests*;-PsychologyApp.Testing"
      - name: Enforce minimum line coverage per layer
        shell: pwsh
        run: |
          # Measured 2026-10-06: Application 84.6%, Domain 90.4%, Infrastructure 79.3%, Presentation.Core 82.5%, all instrumented code 84%.
          # The gate sits a few points below, so a drop is caught without failing on noise. Raise it as coverage rises.
          $summary = Get-Content CoverageReport/Summary.json -Raw | ConvertFrom-Json
          $minimums = @{ 'PsychologyApp.Application' = 82; 'PsychologyApp.Domain' = 86; 'PsychologyApp.Infrastructure' = 76; 'PsychologyApp.Presentation.Core' = 75 }
          $failed = $false
          foreach ($name in $minimums.Keys) {
            $assembly = $summary.coverage.assemblies | Where-Object { $_.name -eq $name }
            if (-not $assembly) { Write-Error "No coverage found for $name"; $failed = $true; continue }
            Write-Host "$name line coverage: $($assembly.coverage)% (minimum $($minimums[$name])%)"
            if ($assembly.coverage -lt $minimums[$name]) { Write-Error "$name is below $($minimums[$name])%"; $failed = $true }
          }
          $overall = $summary.summary.linecoverage
          Write-Host "Overall line coverage: $overall%"
          if ($overall -lt 80) { Write-Error "Overall coverage $overall% is below 80%"; $failed = $true }
          if ($failed) { exit 1 }
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: CoverageReport
      - run: dotnet build PsychologyApp.Presentation/PsychologyApp.Presentation.csproj -f net11.0-android37.0 -c Release

  build-apple:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - run: dotnet workload install maui
      - name: Select Xcode 27.2
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app
      - name: Build iOS Release
        run: dotnet build PsychologyApp.Presentation/PsychologyApp.Presentation.csproj -f net11.0-ios27.2 -c Release -p:EnableCodeSigning=false
      - name: Build Mac Catalyst Release
        run: dotnet build PsychologyApp.Presentation/PsychologyApp.Presentation.csproj -f net11.0-maccatalyst27.2 -c Release -p:EnableCodeSigning=false

  build-test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - name: Build core and test projects
        run: |
          for proj in \
            PsychologyApp.Domain/PsychologyApp.Domain.csproj \
            PsychologyApp.Application/PsychologyApp.Application.csproj \
            PsychologyApp.Infrastructure/PsychologyApp.Infrastructure.csproj \
            PsychologyApp.Bootstrap/PsychologyApp.Bootstrap.csproj \
            PsychologyApp.Testing/PsychologyApp.Testing.csproj \
            PsychologyApp.Presentation.Core/PsychologyApp.Presentation.Core.csproj \
            PsychologyApp.Domain.Tests/PsychologyApp.Domain.Tests.csproj \
            PsychologyApp.Application.Tests/PsychologyApp.Application.Tests.csproj \
            PsychologyApp.Infrastructure.Tests/PsychologyApp.Infrastructure.Tests.csproj \
            PsychologyApp.Integration.Tests/PsychologyApp.Integration.Tests.csproj \
            PsychologyApp.Presentation.Tests/PsychologyApp.Presentation.Tests.csproj
          do
            dotnet build "$proj" -c Debug -p:Net11Only=true
          done
      - name: Run tests
        run: |
          for proj in \
            PsychologyApp.Domain.Tests/PsychologyApp.Domain.Tests.csproj \
            PsychologyApp.Application.Tests/PsychologyApp.Application.Tests.csproj \
            PsychologyApp.Infrastructure.Tests/PsychologyApp.Infrastructure.Tests.csproj \
            PsychologyApp.Integration.Tests/PsychologyApp.Integration.Tests.csproj \
            PsychologyApp.Presentation.Tests/PsychologyApp.Presentation.Tests.csproj
          do
            dotnet test "$proj" -c Debug --no-build -p:Net11Only=true --verbosity minimal
          done
