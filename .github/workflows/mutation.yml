name: mutation

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - run: dotnet tool install -g dotnet-stryker --version 5.0.0
      - name: Mutate Domain
        working-directory: PsychologyApp.Domain.Tests
        run: dotnet stryker
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stryker-domain
          path: PsychologyApp.Domain.Tests/StrykerOutput
  clinical-application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - run: dotnet tool install -g dotnet-stryker --version 5.0.0
      - name: Mutate the crisis detector and self-harm screening
        working-directory: PsychologyApp.Application.Tests
        run: dotnet stryker
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stryker-application
          path: PsychologyApp.Application.Tests/StrykerOutput
